name: Check main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types, source, tests and build
        run: pnpm check
      - name: Check public files
        run: pnpm check:publish
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Test page integration with GM mocks
        run: pnpm test:e2e
